<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Avis Budget - Panel de QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app-root">
    <section class="welcome" id="welcome-screen">
      <div class="welcome-card">
        <h1><span>Avis</span> Budget</h1>
        <p class="welcome-title">Panel de administración de QR</p>
        <p class="welcome-sub">Genera y descarga el QR de cada usuario habilitado</p>

        <section class="featured-qr" aria-label="QR principal de enlace">
          <div id="featured-qr-wrap" class="qr-wrap featured-qr-wrap"></div>
          <div class="featured-actions">
            <button id="download-featured-qr-btn" class="secondary-btn" type="button">Descargar QR</button>
            <button id="copy-featured-link-btn" class="secondary-btn" type="button">Copiar enlace</button>
          </div>
        </section>

        <button id="accept-btn" class="cta-btn" type="button">Ver usuarios</button>
      </div>
    </section>

    <section id="qr-screen" class="qr-screen hidden" aria-live="polite">
      <header class="hero">
        <p class="eyebrow">Formulario por QR</p>
        <h2>Usuarios habilitados</h2>
        <p class="subtitle">Escanea o descarga el QR de cada persona. Cada código incluye ciudad, nombre y enlace a encuesta.</p>
      </header>

      <section id="cities-container" class="cities"></section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
