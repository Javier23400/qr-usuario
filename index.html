<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Avis Budget - QR Personal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app-root">
    <section class="welcome hidden" id="landing-screen">
      <div class="welcome-card landing-card">
        <h1 class="landing-logo-text"><span class="brand-avis">Avis</span><span class="brand-budget">Budget</span></h1>
        <p class="welcome-title" id="landing-greeting">¡Hola!</p>
        <p class="welcome-sub">Pulsa el botón para calificarnos en Google Maps</p>
        <button id="landing-open-btn" class="cta-btn" type="button">Abrir</button>
      </div>
    </section>

    <section class="welcome hidden" id="invalid-link-screen">
      <div class="welcome-card landing-card">
        <h1 class="landing-logo-text"><span class="brand-avis">Avis</span><span class="brand-budget">Budget</span></h1>
        <p class="welcome-title">Enlace no válido</p>
        <p class="welcome-sub">Escanea el código QR de tu ciudad para continuar.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
